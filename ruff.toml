target-version = "py312"
line-length = 88

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "RUF"]

[lint.pydocstyle]
convention = "pep257"

[format]
docstring-code-format = false

[lint.per-file-ignores]
# printf-style formatting is the OpenStack house style
"src/**" = ["UP031"]
"tests/**" = ["UP031"]
